{% extends "base.html" %}
{% block title %}Admin Login{% endblock %}
{% block content %}
<section class="admin-card">
    <h1>Admin Login</h1>
    <form method="POST">
        <label>Username</label>
        <input name="username" required>
        <label>Password</label>
        <input type="password" name="password" required>
        <button type="submit">Login</button>
    </form>
</section>
{% endblock %}
